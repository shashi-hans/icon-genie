name: Deploy icon gallery to GitHub Pages

# Publishes the docs/ preview page (searchable icon gallery) to GitHub Pages
# on every push to main, and on demand. docs/icons.json is generated from the
# committed raw-svgs/ during the build, so nothing external is fetched.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions required by the Pages deploy action.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Regenerates docs/icons.json (and the icon source) from raw-svgs/.
      - name: Build icon data
        run: npm run build:icons

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload gallery artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
