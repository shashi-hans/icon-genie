name: Publish to npm

# Publishes when a version tag is pushed, e.g. `git tag v1.2.3 && git push --tags`.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Builds from the committed raw-svgs/, which is the source of truth for
      # artwork and carries eight vendors, not only Phosphor. CI used to re-import
      # Phosphor first; that could only make the tarball differ from what
      # `npm run build:icons` produces locally. Taking a Phosphor update is a
      # deliberate `npm run import:phosphor` and a commit.
      - name: Build (icons + bundle)
        run: npm run build:all

      - name: Verify tag matches package version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}" >&2
            exit 1
          fi

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
