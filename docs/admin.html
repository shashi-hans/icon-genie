<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' fill='%2315803d' viewBox='0 0 256 256'><path d='M48 64a8 8 0 0 1 8-8h16V40a8 8 0 0 1 16 0v16h16a8 8 0 0 1 0 16H88v16a8 8 0 0 1-16 0V72H56a8 8 0 0 1-8-8m136 128h-8v-8a8 8 0 0 0-16 0v8h-8a8 8 0 0 0 0 16h8v8a8 8 0 0 0 16 0v-8h8a8 8 0 0 0 0-16m56-48h-16v-16a8 8 0 0 0-16 0v16h-16a8 8 0 0 0 0 16h16v16a8 8 0 0 0 16 0v-16h16a8 8 0 0 0 0-16m-20.69-64L80 219.31a16 16 0 0 1-22.62 0l-20.7-20.68a16 16 0 0 1 0-22.63L176 36.69a16 16 0 0 1 22.63 0l20.68 20.68a16 16 0 0 1 0 22.63m-54.63 32L144 91.31l-96 96L68.68 208ZM208 68.69 187.31 48l-32 32L176 100.69Z'/></svg>"
    />
    <title>Icon Review — Admin</title>
    <script>
      // Set the theme before the first paint.
      //
      // app.css defines the light palette on bare :root and dark under
      // [data-theme="dark"], and lib/theme.js is a module that runs after the
      // document has painted. Between those two moments a dark-mode visitor saw
      // a light page — a flash on every navigation between these pages.
      //
      // Deliberately a plain, parser-blocking script in the head, not a module:
      // it has to run before CSS is applied, and it is small enough to inline on
      // every page rather than cost a request that would itself delay the paint.
      // Storage can throw (private mode, blocked cookies), so it fails to light.
      try {
        var savedTheme = localStorage.getItem("icon-genie.theme");
        if (savedTheme === "dark" || savedTheme === "light") {
          document.documentElement.setAttribute("data-theme", savedTheme);
        }
      } catch (e) {
        /* no stored preference reachable; the light default stands */
      }
    </script>
    <style>
      /* Light is the base palette so the first paint is the default theme; the
         theme attribute is set from JS and would otherwise flash dark first.
         --bad and --warn are darker here than in dark mode: the dark-mode red
         and amber sit near 3:1 on white, too weak for the text that uses them. */
      :root {
        --bg: #ffffff;
        --panel: #f6f8fa;
        --border: #d0d7de;
        --fg: #1f2328;
        --muted: #656d76;
        --accent: #15803d;
        --ok: #1a7f37;
        --bad: #cf222e;
        --warn: #9a6700;
      }
      :root[data-theme="dark"] {
        --bg: #0d1117;
        --panel: #161b22;
        --border: #30363d;
        --fg: #e6edf3;
        --muted: #8b949e;
        --accent: #4ade80;
        --ok: #3fb950;
        --bad: #f85149;
        --warn: #e3b341;
      }
      * { box-sizing: border-box; }
      /* The page is a column: header, content that takes the slack, footer. Without
         this the footer sat directly after the queue and floated mid-screen
         whenever the list was short — which is most of the time, since an empty
         queue is the normal state. */
      html { height: 100%; }
      body {
        margin: 0;
        min-height: 100%;
        display: flex;
        flex-direction: column;
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      body > main { flex: 1 0 auto; }
      header {
        border-bottom: 1px solid var(--border);
        padding: 16px 20px;
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      h1 { margin: 0; font-size: 18px; color: var(--accent); }
      .grow { flex: 1; }
      .btn {
        background: var(--panel);
        border: 1px solid var(--border);
        color: var(--fg);
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
        text-decoration: none;
        white-space: nowrap;
      }
      .btn:hover { border-color: var(--accent); }
      .btn[aria-selected="true"] { border-color: var(--accent); color: var(--accent); }
      .btn.ok:hover { border-color: var(--ok); color: var(--ok); }
      .btn.bad:hover { border-color: var(--bad); color: var(--bad); }
      main { padding: 20px; max-width: 1000px; margin: 0 auto; }
      .filters { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
      .note { color: var(--muted); }
      .card {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 16px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--panel);
        padding: 14px;
        margin-bottom: 12px;
      }
      .previews { display: flex; gap: 8px; }
      .previews figure { margin: 0; text-align: center; }
      .previews .cell {
        width: 56px; height: 56px;
        border: 1px solid var(--border); border-radius: 8px;
        display: flex; align-items: center; justify-content: center;
        background: var(--bg);
      }
      .previews svg { width: 36px; height: 36px; color: var(--fg); }
      .previews figcaption { font-size: 10px; color: var(--muted); margin-top: 3px; }
      .meta { min-width: 0; }
      .meta h2 { margin: 0 0 4px; font-size: 16px; }
      dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 8px 0 12px; font-size: 14px; }
      dt { color: var(--muted); }
      dd { margin: 0; word-break: break-word; }
      code {
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 1px 5px;
      }
      pre {
        margin: 0 0 12px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px;
        overflow-x: auto;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        max-height: 130px;
      }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      /* Destructive and identity-changing actions confirm in place rather than
         in a native dialog: the icon stays visible while deciding. */
      .confirm {
        display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        margin-top: 8px; padding: 8px 10px; border-radius: 8px;
        border: 1px solid var(--warn); color: var(--warn); font-size: 12px;
      }
      .confirm[hidden] { display: none; }
      .confirm input {
        background: var(--bg); border: 1px solid var(--border); color: var(--fg);
        padding: 6px 9px; border-radius: 6px; font-size: 14px; width: 180px;
      }
      .btn.danger { border-color: var(--bad); color: var(--bad); }
      .tag { font-size: 12px; border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; color: var(--muted); }
      .tag.approved { border-color: var(--ok); color: var(--ok); }
      .tag.rejected { border-color: var(--bad); color: var(--bad); }
      /* Approving this would overwrite the drawing already served under the
         name, so it is called out above the details rather than inside them. */
      .in-gallery {
        margin: 6px 0 0;
        color: var(--bad);
        font-weight: 600;
      }
      .tag.pending { border-color: var(--warn); color: var(--warn); }
      #status { color: var(--muted); margin-bottom: 12px; min-height: 20px; }
      #status.error { color: var(--bad); }
      .panel-block {
        margin-top: 28px; padding-top: 18px;
        border-top: 1px solid var(--border);
      }
      .panel-block h2 { margin: 0 0 4px; font-size: 16px; color: var(--accent); }
      .panel-block .note { margin: 0 0 12px; font-size: 12px; }
      table.countries { border-collapse: collapse; width: 100%; max-width: 560px; font-size: 14px; }
      table.countries th, table.countries td {
        text-align: left; padding: 6px 10px;
        border-bottom: 1px solid var(--border);
      }
      table.countries th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
      /* Counts read as columns of figures, so they align on the right. */
      table.countries td.num, table.countries th.num { text-align: right; font-variant-numeric: tabular-nums; }
      table.countries tr:last-child td { border-bottom: 0; }
      .flag { margin-right: 8px; }

      footer {
        /* Sticky as well as pushed down, matching the other pages: it stays on
           screen while a long review queue scrolls under it. */
        position: sticky;
        bottom: 0;
        background: var(--bg);
        border-top: 1px solid var(--border);
        padding: 12px 20px; margin-top: 28px;
        font-size: 12px; color: var(--muted);
      }
      .footer-inner {
        display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        max-width: 1000px; margin: 0 auto;
      }
      .footer-inner .spacer { margin-left: auto; }
      footer a { color: var(--muted); }
      .foot-dot { color: var(--border); }

      .gate { max-width: 420px; margin: 60px auto; text-align: center; }
      .gate input {
        width: 100%;
        background: var(--panel);
        border: 1px solid var(--border);
        color: var(--fg);
        padding: 10px 12px;
        border-radius: 8px;
        margin: 12px 0 8px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Icon review</h1>
      <span class="tag" id="who">…</span>
      <span class="grow"></span>
      <a class="btn" href="./index.html">← Home</a>
      <a class="btn" href="./gallery.html">Gallery</a>
      <button class="btn" id="refresh" type="button">Refresh</button>
      <button class="btn" id="logout" type="button" hidden>Log out</button>
    </header>

    <main>
      <!-- Shown when there is no admin session. The real gate is server-side:
           every /api/submissions call re-checks the cookie, so hiding this panel
           is presentation, never protection. -->
      <section class="gate" id="gate" hidden>
        <h2>Admin login</h2>
        <p class="note">This page lists icons people submitted, so it needs an admin session.</p>
        <form id="gate-form">
          <input id="gate-password" type="password" placeholder="Admin password" autocomplete="current-password" />
          <button class="btn" type="submit">Log in</button>
        </form>
        <p class="note" id="gate-status"></p>
      </section>

      <section id="queue" hidden>
        <div class="filters" id="filters">
          <button class="btn" type="button" data-status="pending" aria-selected="true">Pending</button>
          <button class="btn" type="button" data-status="approved" aria-selected="false">Approved</button>
          <button class="btn" type="button" data-status="rejected" aria-selected="false">Rejected</button>
          <button class="btn" type="button" data-status="" aria-selected="false">All</button>
          <!-- A view, not a status filter: it replaces the queue rather than
               filtering it, so it carries its own data attribute. -->
          <button class="btn" type="button" data-view="countries" aria-selected="false">Visitors by country</button>
        </div>
        <div id="status"></div>
        <div id="list"></div>

        <!-- Aggregates only: a country tally, never a country against a guest
             id. See supabase/migrations/0004_visit_countries.sql. -->
        <section id="countries-block" hidden>
          <h2 class="section-heading">Visitors by country</h2>
          <p class="note" id="countries-note"></p>
          <table class="countries" id="countries"></table>
        </section>
      </section>
    </main>

    <footer>
      <div class="footer-inner" data-site-footer-bar></div>
    </footer>

    <script type="module">
      // Same derivation the library and the build use, so what an admin approves
      // is what the React component will render.
      import { deriveWeightInner as weights } from "./stroke-weights.js";
      import { initFooter } from "./lib/footer.js";

      const gate = document.getElementById("gate");
      const gateForm = document.getElementById("gate-form");
      const gatePassword = document.getElementById("gate-password");
      const gateStatus = document.getElementById("gate-status");
      const queue = document.getElementById("queue");
      const list = document.getElementById("list");
      const statusEl = document.getElementById("status");
      const whoEl = document.getElementById("who");
      const logoutBtn = document.getElementById("logout");
      const filters = document.getElementById("filters");
      let filter = "pending";

      // Escape before interpolating anything a submitter controls. The name and
      // prompt arrive from an open endpoint, so they are untrusted text; path data
      // goes through the server's validator, which rejects anything but path
      // characters.
      const esc = (s) =>
        String(s ?? "").replace(/[&<>"']/g, (c) =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
        );

      async function api(path, opts = {}) {
        const res = await fetch(path, {
          credentials: "same-origin",
          headers: opts.body ? { "content-type": "application/json" } : undefined,
          ...opts,
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
        return data;
      }

      // Follows the same stored choice as the rest of the app. The head script
      // has already applied it before paint; this only covers the case of the
      // attribute never having been set.
      function applyTheme() {
        if (document.documentElement.hasAttribute("data-theme")) return;
        document.documentElement.setAttribute("data-theme", "light");
      }

      function cardHtml(row) {
        const w = weights(row.paths);
        const previews = ["thin", "regular", "fill", "duotone"]
          .map(
            (name) =>
              `<figure><div class="cell"><svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">${w[name]}</svg></div><figcaption>${name}</figcaption></figure>`
          )
          .join("");
        const file = `raw-svgs/${esc(row.name)}/${esc(row.name)}.centerline.svg`;
        const pending = row.status === "pending";
        return `
          <article class="card" data-id="${esc(row.id)}">
            <div class="previews">${previews}</div>
            <div class="meta">
              <h2>${esc(row.name)} <span class="tag ${row.status}">${row.status}</span></h2>
              ${row.inGallery ? `<p class="in-gallery">icon already present in gallery</p>` : ""}
              <dl>
                <dt>Component</dt><dd><code>${esc(toPascal(row.name))}</code></dd>
                <dt>Contributor</dt><dd>${esc(row.contributor || "Anonymous")}</dd>
                <dt>Asked for</dt><dd>${esc(row.prompt) || "<span class='note'>(none)</span>"}</dd>
                <dt>Summary</dt><dd>${esc(row.summary) || "<span class='note'>(none)</span>"}</dd>
                <dt>Paths</dt><dd>${row.paths.length}</dd>
                <dt>Source</dt><dd>${esc(row.source)}</dd>
                <dt>Submitted</dt><dd>${new Date(row.createdAt).toLocaleString()}</dd>
                <dt>Submitter</dt><dd><code>${esc(row.guestId).slice(0, 12)}…</code></dd>
                ${row.reviewedAt ? `<dt>Reviewed</dt><dd>${new Date(row.reviewedAt).toLocaleString()}</dd>` : ""}
                <dt>Add as</dt><dd><code>${file}</code></dd>
              </dl>
              <pre>${esc(centerlineSvg(row.paths))}</pre>
              <div class="actions">
                <button class="btn" data-act="copy">Copy source SVG</button>
                <button class="btn" data-act="download">Download source</button>
                ${pending ? `<button class="btn ok" data-act="approve">Approve</button>` : ""}
                ${pending ? `<button class="btn bad" data-act="reject">Reject</button>` : ""}
                ${!pending ? `<button class="btn" data-act="reopen">Move back to pending</button>` : ""}
                <button class="btn" data-act="rename">Change contributor</button>
                <button class="btn danger" data-act="delete">Delete</button>
              </div>
              <div class="confirm" data-confirm="rename" hidden>
                <span>New contributor name:</span>
                <input data-field="contributor" maxlength="20" value="${esc(row.contributor || "")}" />
                <button class="btn" data-act="rename-save">Save name</button>
                <button class="btn" data-act="cancel">Cancel</button>
              </div>
              <div class="confirm" data-confirm="delete" hidden>
                <span>Delete <strong>${esc(row.name)}</strong>? It leaves the gallery, its source file is
                removed, and the contributor is not told.</span>
                <button class="btn danger" data-act="delete-confirm">Delete for good</button>
                <button class="btn" data-act="cancel">Cancel</button>
              </div>
            </div>
          </article>`;
      }

      function toPascal(name) {
        const p = String(name)
          .split(/[^a-zA-Z0-9]+/)
          .filter(Boolean)
          .map((s) => s[0].toUpperCase() + s.slice(1))
          .join("");
        return /^[0-9]/.test(p) ? "Icon" + p : p || "Icon";
      }

      function centerlineSvg(paths) {
        return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">${paths
          .map((d) => `<path d="${d}"/>`)
          .join("")}</svg>`;
      }

      let rows = [];

      async function load() {
        statusEl.className = "";
        statusEl.textContent = "Loading…";
        try {
          const query = filter ? `?status=${encodeURIComponent(filter)}` : "";
          const data = await api(`/api/submissions${query}`);
          rows = data.submissions;
          const c = data.counts;
          statusEl.textContent = rows.length
            ? `${rows.length} shown · ${c.pending} pending, ${c.approved} approved, ${c.rejected} rejected`
            : `Nothing ${filter || "here"} yet. ${c.pending} pending overall.`;
          list.innerHTML = rows.map(cardHtml).join("");
        } catch (err) {
          if (/admin session/i.test(err.message)) return showGate();
          statusEl.className = "error";
          statusEl.textContent = err.message;
        }
      }

      function showGate() {
        gate.hidden = false;
        queue.hidden = true;
        logoutBtn.hidden = true;
        whoEl.textContent = "Guest";
        gatePassword.focus();
      }

      async function showQueue() {
        gate.hidden = true;
        queue.hidden = false;
        logoutBtn.hidden = false;
        whoEl.textContent = "Admin";
        whoEl.className = "tag approved";
        await load();
      }

      async function review(id, status) {
        statusEl.className = "";
        statusEl.textContent = status === "approved" ? "Approving and publishing…" : "Saving…";
        try {
          const { published } = await api(`/api/submissions/${encodeURIComponent(id)}`, {
            method: "PATCH",
            body: JSON.stringify({ status }),
          });
          await load();
          // load() rewrites the status line, so report the publish result after
          // it — an approval that failed to publish must not look like a success.
          if (published) reportPublish(published);
        } catch (err) {
          statusEl.className = "error";
          statusEl.textContent = err.message;
        }
      }

      function reportPublish(published) {
        statusEl.className = published.error ? "error" : "";
        statusEl.replaceChildren(
          document.createTextNode(`${published.filePath} — ${published.detail} `)
        );
        if (published.url) {
          const a = document.createElement("a");
          a.href = published.url;
          a.target = "_blank";
          a.rel = "noopener";
          a.textContent = published.url;
          statusEl.appendChild(a);
        }
      }

      // The anchor is put in the document and the URL is revoked on a timer:
      // Firefox ignores a click on a detached anchor, and revoking in the same
      // tick cancels the download it has not started reading yet.
      function download(name, text) {
        const url = URL.createObjectURL(new Blob([text], { type: "image/svg+xml" }));
        const a = document.createElement("a");
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      /** Show one confirm row on a card and hide the other. */
      function showConfirm(card, which) {
        for (const box of card.querySelectorAll("[data-confirm]")) {
          box.hidden = box.dataset.confirm !== which;
        }
        if (which) card.querySelector(`[data-confirm="${which}"] input`)?.focus();
      }

      async function renameContributor(id, card) {
        const value = card.querySelector('[data-field="contributor"]').value;
        statusEl.className = "";
        statusEl.textContent = "Saving name…";
        try {
          const { submission } = await api(`/api/submissions/${encodeURIComponent(id)}`, {
            method: "PATCH",
            body: JSON.stringify({ contributor: value }),
          });
          await load();
          statusEl.textContent = `Contributor for ${submission.name} is now ${submission.contributor}.`;
        } catch (err) {
          statusEl.className = "error";
          statusEl.textContent = err.message;
        }
      }

      async function deleteSubmission(id) {
        statusEl.className = "";
        statusEl.textContent = "Deleting…";
        try {
          const { deleted, unpublished } = await api(`/api/submissions/${encodeURIComponent(id)}`, {
            method: "DELETE",
          });
          await load();
          statusEl.className = unpublished?.error ? "error" : "";
          statusEl.textContent = `Deleted ${deleted.name}. ${unpublished?.detail ?? ""}`;
        } catch (err) {
          statusEl.className = "error";
          statusEl.textContent = err.message;
        }
      }

      list.addEventListener("click", async (e) => {
        const btn = e.target.closest("[data-act]");
        if (!btn) return;
        const card = btn.closest(".card");
        const id = card?.dataset.id;
        const row = rows.find((r) => r.id === id);
        if (!row) return;
        const act = btn.dataset.act;
        // Both special powers ask first: one is destructive, the other rewrites
        // a credit that is shown publicly.
        if (act === "rename") return showConfirm(card, "rename");
        if (act === "delete") return showConfirm(card, "delete");
        if (act === "cancel") return showConfirm(card, null);
        if (act === "rename-save") return renameContributor(id, card);
        if (act === "delete-confirm") return deleteSubmission(id);
        if (act === "approve") return review(id, "approved");
        if (act === "reject") return review(id, "rejected");
        if (act === "reopen") return review(id, "pending");
        const svg = centerlineSvg(row.paths) + "\n";
        if (act === "copy") {
          await navigator.clipboard.writeText(svg);
          statusEl.className = "";
          statusEl.textContent = `Copied ${row.name}.centerline.svg — save it to raw-svgs/${row.name}/ and run npm run build:icons`;
        } else if (act === "download") {
          download(`${row.name}.centerline.svg`, svg);
        }
      });

      const countriesBlock = document.getElementById("countries-block");

      /** Mark the pressed button and clear the rest, across both kinds. */
      function selectFilter(btn) {
        for (const b of filters.querySelectorAll("button")) {
          b.setAttribute("aria-selected", String(b === btn));
        }
      }

      filters.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-status], button[data-view]");
        if (!btn) return;
        selectFilter(btn);

        if (btn.dataset.view === "countries") {
          // The queue and the tally answer different questions, so only one is
          // on screen at a time rather than the tally hanging below the list.
          list.hidden = true;
          statusEl.textContent = "";
          countriesBlock.hidden = false;
          loadCountries();
          return;
        }

        countriesBlock.hidden = true;
        list.hidden = false;
        filter = btn.dataset.status;
        load();
      });

      gateForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        gateStatus.textContent = "Checking…";
        try {
          await api("/api/auth/login", {
            method: "POST",
            body: JSON.stringify({ password: gatePassword.value }),
          });
          gatePassword.value = "";
          gateStatus.textContent = "";
          await showQueue();
        } catch (err) {
          gateStatus.textContent = err.message;
        }
      });

      logoutBtn.addEventListener("click", async () => {
        try {
          await api("/api/auth/logout", { method: "POST" });
        } finally {
          showGate();
        }
      });

      // Refresh reloads whichever view is showing.
      document.getElementById("refresh").addEventListener("click", () => {
        if (countriesBlock.hidden) load();
        else loadCountries();
      });

      /* --- Visitors by country --------------------------------------------- */
      // ISO alpha-2 codes come back from the API; the names come from the
      // browser rather than a bundled country table, and the flag from the
      // regional-indicator code points for the same two letters.
      const countryName = (() => {
        let names = null;
        try {
          names = new Intl.DisplayNames(navigator.languages ?? ["en"], { type: "region" });
        } catch {
          /* older browser: fall back to the raw code */
        }
        return (code) => {
          // ZZ is the ISO code for "no country reported". Every row currently under
        // it is local test traffic, so it is labelled as such — but the code also
        // covers a real visit that arrives with no CDN header, which this name
        // would then describe wrongly. Clear the row and rename this back if the
        // app is ever served without a CDN in front of it.
        if (code === "ZZ") return "ClaudeTest";
          try {
            return names?.of(code) || code;
          } catch {
            return code;
          }
        };
      })();

      function flagFor(code) {
        if (!/^[A-Z]{2}$/.test(code) || code === "ZZ") return "🏳️";
        return String.fromCodePoint(...[...code].map((c) => 0x1f1e6 + c.charCodeAt(0) - 65));
      }

      async function loadCountries() {
        const block = document.getElementById("countries-block");
        const table = document.getElementById("countries");
        const note = document.getElementById("countries-note");
        try {
          const { countries } = await api("/api/visits/countries");
          block.hidden = false;
          if (!countries.length) {
            note.textContent = "No visits recorded yet.";
            table.innerHTML = "";
            return;
          }
          const totalVisitors = countries.reduce((n, c) => n + c.visitors, 0);
          const totalViews = countries.reduce((n, c) => n + c.views, 0);
          note.textContent =
            `${totalVisitors.toLocaleString()} visitors and ${totalViews.toLocaleString()} views across ` +
            `${countries.length} ${countries.length === 1 ? "country" : "countries"}. ` +
            `Counts only — no country is stored against a visitor.`;
          const unknown = countries.find((c) => c.country === "ZZ");
          if (unknown) {
            // Without this the row reads as a bug rather than as what it is: a
            // visit that arrived with no CDN country header, which is every
            // visit in local development.
            note.textContent +=
              ` "ClaudeTest" (${unknown.views.toLocaleString()} views) is traffic that reached the app` +
              ` without a country header — local development, or a deploy with no CDN in front of it.`;
          }
          table.innerHTML =
            "<tr><th>Country</th><th class='num'>Visitors</th><th class='num'>Views</th><th>Last seen</th></tr>" +
            countries
              .map(
                (c) =>
                  `<tr><td><span class="flag">${flagFor(c.country)}</span>${esc(countryName(c.country))}` +
                  `<span class="note"> ${esc(c.country)}</span></td>` +
                  `<td class="num">${c.visitors.toLocaleString()}</td>` +
                  `<td class="num">${c.views.toLocaleString()}</td>` +
                  `<td>${c.lastSeen ? new Date(c.lastSeen).toLocaleDateString() : "—"}</td></tr>`
              )
              .join("");
        } catch (err) {
          // The queue is the page's job; a missing tally must not hide it.
          block.hidden = false;
          note.textContent = `Could not load the country tally: ${err.message}`;
          table.innerHTML = "";
        }
      }

      applyTheme();
      initFooter();
      try {
        const who = await api("/api/auth/me");
        if (who.role === "admin") await showQueue();
        else showGate();
      } catch {
        statusEl.className = "error";
        statusEl.textContent =
          "No API reachable. This page needs the backend running (vercel dev), not a static file server.";
        gate.hidden = true;
        queue.hidden = false;
      }
    </script>
  </body>
</html>
