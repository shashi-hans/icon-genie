<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>@shashihans/icons — preview</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --border: #30363d;
        --fg: #e6edf3;
        --muted: #8b949e;
        --accent: #58a6ff;
      }
      :root[data-theme="light"] {
        --bg: #ffffff;
        --panel: #f6f8fa;
        --border: #d0d7de;
        --fg: #1f2328;
        --muted: #656d76;
        --accent: #0969da;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      header {
        position: sticky;
        top: 0;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
        padding: 16px 20px;
        z-index: 10;
      }
      h1 { margin: 0 0 4px; font-size: 18px; }
      .sub { color: var(--muted); margin-bottom: 12px; }
      .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
      input[type="search"] {
        flex: 1;
        min-width: 220px;
        background: var(--panel);
        border: 1px solid var(--border);
        color: var(--fg);
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 14px;
      }
      select {
        background: var(--panel);
        border: 1px solid var(--border);
        color: var(--fg);
        padding: 10px 12px;
        border-radius: 8px;
      }
      .count { color: var(--muted); white-space: nowrap; }
      #theme-toggle {
        background: var(--panel);
        border: 1px solid var(--border);
        color: var(--fg);
        padding: 10px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
        white-space: nowrap;
      }
      #theme-toggle:hover { border-color: var(--accent); }
      main {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 10px;
        padding: 20px;
      }
      .cell {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 16px 8px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--panel);
        cursor: pointer;
        transition: border-color 0.15s, transform 0.05s;
        text-align: center;
      }
      .cell:hover { border-color: var(--accent); }
      .cell:active { transform: scale(0.97); }
      .cell svg { width: 32px; height: 32px; color: var(--fg); }
      .cell .name {
        font-size: 11px;
        color: var(--muted);
        word-break: break-word;
        line-height: 1.3;
      }
      .empty { padding: 40px 20px; color: var(--muted); }
      #toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: var(--accent);
        color: #0d1117;
        padding: 10px 16px;
        border-radius: 8px;
        font-weight: 600;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s, transform 0.2s;
      }
      #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
  </head>
  <body>
    <header>
      <h1>@shashihans/icons</h1>
      <div class="sub">Click any icon to copy its import statement.</div>
      <div class="controls">
        <input id="search" type="search" placeholder="Search icons…" autocomplete="off" />
        <select id="weight" title="Preview weight">
          <option value="regular">regular</option>
        </select>
        <button id="theme-toggle" type="button" title="Toggle light/dark theme" aria-label="Toggle theme"></button>
        <span class="count" id="count">Loading…</span>
      </div>
    </header>
    <main id="grid"><div class="empty">Loading icons…</div></main>
    <div id="toast"></div>

    <script>
      const grid = document.getElementById("grid");
      const search = document.getElementById("search");
      const countEl = document.getElementById("count");
      const weightEl = document.getElementById("weight");
      const toast = document.getElementById("toast");
      const themeToggle = document.getElementById("theme-toggle");

      let icons = [];
      let currentWeight = "regular";

      // Theme: persisted in localStorage, else falls back to the OS preference.
      // Default stylesheet is dark; setting data-theme="light" flips the vars.
      function applyTheme(theme) {
        const isLight = theme === "light";
        document.documentElement.setAttribute("data-theme", isLight ? "light" : "dark");
        // Button shows the action it performs next.
        themeToggle.textContent = isLight ? "🌙 Dark" : "☀️ Light";
      }

      function initTheme() {
        let saved = null;
        try {
          saved = localStorage.getItem("theme");
        } catch {
          // localStorage may be blocked (e.g. file://); ignore.
        }
        const prefersLight =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: light)").matches;
        applyTheme(saved || (prefersLight ? "light" : "dark"));
      }

      themeToggle.addEventListener("click", () => {
        const next =
          document.documentElement.getAttribute("data-theme") === "light"
            ? "dark"
            : "light";
        applyTheme(next);
        try {
          localStorage.setItem("theme", next);
        } catch {
          // ignore persistence failure
        }
      });

      initTheme();

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add("show");
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => toast.classList.remove("show"), 1500);
      }

      function copyImport(component) {
        const stmt = `import { ${component} } from "@shashihans/icons";`;
        navigator.clipboard.writeText(stmt).then(
          () => showToast(`Copied: ${component}`),
          () => showToast("Copy failed")
        );
      }

      function render(list) {
        if (!list.length) {
          grid.innerHTML = '<div class="empty">No icons match your search.</div>';
          return;
        }
        // Build with a fragment for speed across ~1,500 nodes.
        const frag = document.createDocumentFragment();
        for (const icon of list) {
          const cell = document.createElement("div");
          cell.className = "cell";
          cell.title = `Click to copy import for ${icon.component}`;
          const markup = icon.weights[currentWeight] || icon.weights.regular || "";
          cell.innerHTML =
            `<svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">${markup}</svg>` +
            `<span class="name">${icon.name}</span>`;
          cell.addEventListener("click", () => copyImport(icon.component));
          frag.appendChild(cell);
        }
        grid.replaceChildren(frag);
      }

      function applyFilter() {
        const q = search.value.trim().toLowerCase();
        const list = q
          ? icons.filter(
              (i) =>
                i.name.toLowerCase().includes(q) ||
                i.component.toLowerCase().includes(q)
            )
          : icons;
        countEl.textContent = `${list.length} / ${icons.length} icons`;
        render(list);
      }

      search.addEventListener("input", applyFilter);
      weightEl.addEventListener("change", () => {
        currentWeight = weightEl.value;
        applyFilter();
      });

      fetch("./icons.json")
        .then((r) => {
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          return r.json();
        })
        .then((data) => {
          icons = data.icons || [];
          // Populate the (display-only) weight selector from the data file.
          if (Array.isArray(data.weights)) {
            weightEl.innerHTML = data.weights
              .map(
                (w) =>
                  `<option value="${w}"${w === "regular" ? " selected" : ""}>${w}</option>`
              )
              .join("");
          }
          applyFilter();
        })
        .catch((err) => {
          grid.innerHTML =
            `<div class="empty">Could not load icons.json (${err.message}).<br/>` +
            `Run <code>npm run build:icons</code>, then serve this folder ` +
            `(e.g. <code>npx serve docs</code>).</div>`;
          countEl.textContent = "";
        });
    </script>
  </body>
</html>
